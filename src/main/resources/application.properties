# The tool handles database credentials: listen on localhost only. Change deliberately, behind your own auth.
server.address=127.0.0.1
server.port=8080

# Never log request bodies/parameters (connection requests contain passwords).
logging.level.root=INFO
logging.level.org.springframework.web=WARN
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never

dbmerge.reports-dir=reports
